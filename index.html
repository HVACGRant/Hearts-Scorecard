<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c4a31">
<title>Hearts Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly game-night tool, one thumb at the card table
   IDEA: a score pad lying on green felt
   PICTURE: standings + the number-entry pad are the picture
   COLOUR and TYPE: felt green, card-white panels, heart red, spade black; DM Serif Display + Figtree
   LAYOUT: one column, big targets, record button pinned to the bottom within thumb reach */
:root{color-scheme:light dark;
--felt:light-dark(#0f5a3c,#0a2a1e);--felt2:light-dark(#0c4a31,#071f16);
--card:light-dark(#fffdf8,#15211b);--ink:light-dark(#1b1a17,#eef2ee);--soft:light-dark(#6b6a63,#9fb1a7);
--line:light-dark(#e6e1d6,#26362e);--red:light-dark(#c8202f,#ff5a66);--chip:light-dark(#f3efe5,#1d2c24)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--felt),var(--felt2));background-attachment:fixed;color:var(--ink);font:17px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) max(4vw,12px) calc(120px + env(safe-area-inset-bottom))}
header{color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 4px 14px}
h1{font:400 clamp(34px,8vw,46px)/1.05 "DM Serif Display",serif;margin:0}
h1 span{color:#ff7a84}
#status{font-weight:600;font-size:15px;opacity:.9;margin:-8px 4px 14px;color:#fff}
.panel{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
h2{font:400 26px/1.1 "DM Serif Display",serif;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 small{font:600 14px Figtree,sans-serif;color:var(--soft)}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:14px;min-height:52px;min-width:52px;background:var(--chip);touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid #4aa3ff;outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
.hb{background:rgba(0,0,0,.25);color:#fff;font-weight:700;padding:0 16px;min-height:48px}
input{font:inherit;font-size:18px;width:100%;min-height:54px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--chip);color:var(--ink)}
input:focus{border-color:var(--red);outline:none}
label{display:block;font-size:14px;font-weight:700;color:var(--soft);margin:12px 0 6px}
/* setup */
.chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.chips button{font-size:22px;font-weight:800}
.chips button[aria-pressed=true]{background:var(--red);color:#fff}
.names{display:grid;gap:10px;margin-top:4px}
.nmrow{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;gap:8px}
.nmrow b{color:var(--soft);text-align:center;font-size:18px}
.start{width:100%;margin-top:16px;background:var(--red);color:#fff;font-weight:800;font-size:19px;min-height:58px}
.note{font-size:14px;color:var(--soft);margin:12px 0 0}
#cnote{background:var(--chip);border-radius:12px;padding:12px;margin-top:12px;font-weight:600}
/* standings */
ol{list-style:none;margin:0;padding:0}
.st{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.st:first-child{border-top:0}
.rk{font-weight:800;color:var(--soft);text-align:center}
.st.lead .rk{color:var(--red);font-size:22px}
.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tot{font:400 30px/1 "DM Serif Display",serif;text-align:right;font-variant-numeric:tabular-nums}
.dl{font-size:13px;color:var(--soft);text-align:right;grid-column:3}
.bar{grid-column:2;height:7px;border-radius:7px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:7px;transition:width .4s}
.over{background:var(--red);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.over b{font:400 22px/1.2 "DM Serif Display",serif}
.light{background:#fff;color:var(--red);font-weight:800;padding:0 18px}
/* entry */
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 86px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .nm{font-size:19px}
.row .sub{display:block;font-size:13px;color:var(--soft);font-weight:400}
.pt{font-size:28px;font-weight:800;text-align:center;padding:6px;min-height:60px;font-variant-numeric:tabular-nums}
.q{padding:0 12px;font-weight:800;border:2px solid var(--line);background:none;white-space:nowrap;font-size:16px;min-height:56px}
.q[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tip{font-size:14px;color:var(--soft);margin:10px 0 0}
/* bottom bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);box-shadow:0 -8px 24px rgba(0,0,0,.25);padding:10px max(4vw,12px) calc(10px + env(safe-area-inset-bottom))}
.dock .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
#msg{flex:1;font-weight:700;color:var(--soft);font-size:15px;line-height:1.3}
#msg.ok{color:var(--red)}
#rec{background:var(--red);color:#fff;font-weight:800;font-size:18px;padding:0 22px;min-height:58px;white-space:nowrap}
/* history */
.ghost{padding:0 16px;font-weight:700;font-size:15px;min-height:48px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--soft);font-weight:700;max-width:90px;overflow:hidden;text-overflow:ellipsis}
th:first-child,td:first-child{text-align:left;color:var(--soft)}
tfoot td{font-weight:800;border:0;color:var(--ink)!important}
td.m{color:var(--red);font-weight:800}
.empty{color:var(--soft);margin:4px 0}
[hidden]{display:none!important}
@media(max-width:380px){.chips button{font-size:19px}.row{grid-template-columns:minmax(0,1fr) auto 74px}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Hearts <span>♥</span></h1>
    <button class="hb" id="edit">Players</button>
  </header>
  <div id="status"></div>

  <section class="panel" id="setup" hidden>
    <h2>Who's playing?</h2>
    <label>Number of players</label>
    <div class="chips" id="chips"></div>
    <div id="cnote" hidden></div>
    <label>Names</label>
    <div class="names" id="names"></div>
    <label for="tgt">Game ends at</label>
    <input id="tgt" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="off">
    <p class="note" id="deck"></p>
    <button class="start" id="go">Start playing</button>
  </section>

  <div id="game">
    <section class="panel" id="entry">
      <h2><span id="hn">Hand 1</span> <small>Points this hand</small></h2>
      <div id="rows"></div>
      <p class="tip">Type each player's points, or count hearts and tap Q♠ to add 13. If someone shot the moon, enter 26 for them and 0 for everyone else, and it gets scored as a moon shot.</p>
    </section>

    <section class="panel">
      <h2>Standings <small id="tgtl"></small></h2>
      <div id="over"></div>
      <ol id="stand"></ol>
    </section>

    <section class="panel">
      <h2>Hand history <button class="ghost" id="undo">Undo last</button></h2>
      <div id="hist"></div>
    </section>
  </div>
</div>

<div class="dock" id="dock"><div class="in"><span id="msg"></span><button id="rec" disabled>Record</button></div></div>

<script>
{
const K='hearts-scoreboard-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DECK={3:['2♦',17],4:['nothing',13],5:['2♦ and 2♠',10],6:['2♦, 3♦, 2♠ and 3♠',8],7:['2♦, 3♦ and 2♠',7],8:['2♦, 3♦, 2♠ and 3♠',6]};
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&Array.isArray(s.players))return s}catch(e){}return null}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const saved=load();
let S=saved||{players:['','','',''],target:100,hands:[]};
const fresh=()=>({v:S.players.map(()=>''),q:S.players.map(()=>false)});
let E=fresh(),pendingN=0,setupOpen=!saved||!S.hands.length&&!S.started;

const nameOf=i=>S.players[i]||('Player '+(i+1));
const totals=()=>{const t=S.players.map(()=>0);S.hands.forEach(h=>h.pts.forEach((p,i)=>t[i]+=p||0));return t};
const isOver=()=>totals().some(v=>v>=S.target);
function passDir(n){const c=S.players.length===4?['Pass left','Pass right','Pass across','No pass']:['Pass left','Pass right','No pass'];return c[n%c.length]}
const raw=i=>(parseInt(E.v[i],10)||0)+(E.q[i]?13:0);
function score(){const r=S.players.map((p,i)=>raw(i)),sum=r.reduce((a,b)=>a+b,0);
  const moon=r.findIndex(v=>v===26);const isMoon=moon>=0&&sum===26;
  return{sum,moon:isMoon?moon:-1,pts:isMoon?r.map((v,i)=>i===moon?0:26):r}}

function renderTop(){const n=S.hands.length;
  $('status').textContent=setupOpen?'Set up your table':isOver()?'Game over':'Hand '+(n+1)+' · '+passDir(n)+' · '+S.players.length+' players';
  $('tgtl').textContent='Lowest wins · ends at '+S.target;
  $('setup').hidden=!setupOpen;$('game').hidden=setupOpen;$('dock').hidden=setupOpen;
  $('edit').textContent=setupOpen?'Done':'Players'}

function renderStand(){const t=totals(),last=S.hands[S.hands.length-1];
  const ord=t.map((v,i)=>i).sort((a,b)=>t[a]-t[b]);const min=Math.min(...t);
  $('stand').innerHTML=ord.map(i=>{const lead=t[i]===min&&S.hands.length>0;
    const rank=ord.filter(j=>t[j]<t[i]).length+1;
    return `<li class="st${lead?' lead':''}"><span class="rk">${lead?'♥':rank}</span><span class="nm">${esc(nameOf(i))}</span><span class="tot">${t[i]}</span>
      <span></span><span class="bar"><i style="width:${Math.min(100,t[i]/S.target*100)}%"></i></span><span class="dl">${last?'+'+(last.pts[i]||0)+' last':''}</span></li>`}).join('');
  if(isOver()){const w=S.players.map((p,i)=>i).filter(i=>t[i]===min).map(i=>esc(nameOf(i)));
    $('over').innerHTML=`<div class="over"><b>${w.join(' & ')} win${w.length>1?'':'s'} with ${min}!</b><button class="light" data-a="rematch">Rematch</button></div>`}
  else $('over').innerHTML=''}

function renderRows(){const over=isOver(),n=S.players.length;
  $('hn').textContent='Hand '+(S.hands.length+1);
  $('rows').innerHTML=S.players.map((p,i)=>`<div class="row"><span class="nm">${esc(nameOf(i))}<span class="sub" id="sub${i}"></span></span>
    <button class="q" data-a="q" data-i="${i}" aria-pressed="${E.q[i]}" aria-label="${esc(nameOf(i))} took the queen of spades, add 13" ${over?'disabled':''}>Q♠</button>
    <input class="pt" id="pt${i}" data-i="${i}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" enterkeyhint="${i<n-1?'next':'done'}" placeholder="0" aria-label="Points for ${esc(nameOf(i))}" value="${esc(E.v[i])}" autocomplete="off" ${over?'disabled':''}></div>`).join('');
  updateMsg()}

function updateMsg(){const over=isOver(),sc=score(),m=$('msg'),b=$('rec');m.className='';
  S.players.forEach((p,i)=>{const el=$('sub'+i);if(el)el.textContent=E.q[i]?(parseInt(E.v[i],10)||0)+' + 13 = '+raw(i):''});
  const any=S.players.some((p,i)=>E.v[i]!==''||E.q[i]);
  if(over){m.textContent='Game over. Tap Rematch.';b.disabled=true;b.textContent='Record';return}
  if(!any){m.textContent='Enter points for this hand';b.disabled=true;b.textContent='Record';return}
  b.disabled=false;
  if(sc.moon>=0){m.textContent=nameOf(sc.moon)+' shot the moon! Others get 26.';m.className='ok';b.textContent='Record'}
  else if(sc.sum===26){m.textContent='Adds up to 26 ✓';m.className='ok';b.textContent='Record'}
  else{m.textContent='Total is '+sc.sum+' (usually 26)';b.textContent='Record anyway'}}

function renderHist(){const n=S.hands.length;$('undo').disabled=!n;
  if(!n){$('hist').innerHTML='<p class="empty">No hands yet.</p>';return}
  const t=totals();
  $('hist').innerHTML=`<div class="scroll"><table><thead><tr><th>#</th>${S.players.map((p,i)=>`<th>${esc(nameOf(i))}</th>`).join('')}</tr></thead>
    <tbody>${S.hands.map((h,k)=>`<tr><td>${k+1}</td>${S.players.map((p,i)=>`<td class="${h.moon===i?'m':''}">${h.moon===i?'☾ 0':(h.pts[i]||0)}</td>`).join('')}</tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td>${t.map(v=>`<td>${v}</td>`).join('')}</tr></tfoot></table></div><p class="note">☾ marks a moon shot.</p>`}

function renderSetup(){const n=S.players.length;
  $('chips').innerHTML=[3,4,5,6,7,8].map(k=>`<button data-a="n" data-i="${k}" aria-pressed="${k===n}">${k}</button>`).join('');
  $('names').innerHTML=S.players.map((p,i)=>`<div class="nmrow"><b>${i+1}</b><input id="nm${i}" data-i="${i}" value="${esc(p)}" placeholder="Player ${i+1}" maxlength="20" autocomplete="off" autocapitalize="words" enterkeyhint="${i<n-1?'next':'done'}" aria-label="Name of player ${i+1}"></div>`).join('');
  $('tgt').value=S.target;
  const d=DECK[n];$('deck').textContent=n===4?'4 players: full deck, 13 cards each, 2♣ leads first.':`${n} players: take out ${d[0]} so everyone gets ${d[1]} cards. 2♣ still leads first.`;
  $('go').textContent=S.hands.length?'Back to the game':'Start playing'}

function render(){renderTop();if(setupOpen)renderSetup();else{renderRows();renderStand();renderHist()}}
function applyCount(v){const names=S.players.slice(0,v);while(names.length<v)names.push('');
  S.players=names;S.hands=[];E=fresh();pendingN=0;$('cnote').hidden=true;save();render()}

document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
  if(a==='q'){E.q[i]=!E.q[i];if(E.q[i])E.q=E.q.map((x,j)=>j===i);b.blur();renderRows()}
  else if(a==='rematch'){S.hands=[];E=fresh();save();render()}
  else if(a==='n'){if(i===S.players.length)return;
    if(!S.hands.length){applyCount(i);return}
    pendingN=i;const c=$('cnote');c.hidden=false;
    c.innerHTML=`Switching to ${i} players clears the ${S.hands.length} hand${S.hands.length>1?'s':''} played.<div style="display:flex;gap:10px;margin-top:10px"><button class="ghost" data-a="cno" style="flex:1">Keep game</button><button class="start" data-a="cyes" style="flex:1;margin:0">Clear &amp; switch</button></div>`}
  else if(a==='cyes')applyCount(pendingN)
  else if(a==='cno'){pendingN=0;$('cnote').hidden=true}});

$('rows').addEventListener('input',e=>{const i=+e.target.dataset.i;const v=e.target.value.replace(/\D/g,'').slice(0,2);
  if(v!==e.target.value)e.target.value=v;E.v[i]=v;updateMsg()});
$('rows').addEventListener('focusin',e=>{if(e.target.select)setTimeout(()=>e.target.select(),0)});
$('rows').addEventListener('keydown',e=>{if(e.key!=='Enter')return;e.preventDefault();const i=+e.target.dataset.i,nx=$('pt'+(i+1));if(nx)nx.focus();else e.target.blur()});
$('names').addEventListener('input',e=>{const i=+e.target.dataset.i;S.players[i]=e.target.value.trim();save()});
$('names').addEventListener('keydown',e=>{if(e.key!=='Enter')return;e.preventDefault();const i=+e.target.dataset.i,nx=$('nm'+(i+1));if(nx)nx.focus();else $('tgt').focus()});
$('tgt').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4)});
$('tgt').addEventListener('change',e=>{S.target=Math.max(10,parseInt(e.target.value,10)||100);e.target.value=S.target;save()});
$('tgt').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur()}});

$('rec').addEventListener('click',()=>{const sc=score();S.hands.push({pts:sc.pts,moon:sc.moon,raw:S.players.map((p,i)=>raw(i))});E=fresh();save();render();
  const f=$('pt0');if(f)f.blur();window.scrollTo({top:0,behavior:'smooth'})});
$('undo').addEventListener('click',()=>{const h=S.hands.pop();if(!h)return;
  const r=h.raw||h.pts.map((v,i)=>h.moon>=0?(i===h.moon?26:0):v);
  E={v:r.map(x=>x?String(x):''),q:S.players.map(()=>false)};save();render()});
$('go').addEventListener('click',()=>{S.target=Math.max(10,parseInt($('tgt').value,10)||100);S.started=true;setupOpen=false;save();render();window.scrollTo(0,0)});
$('edit').addEventListener('click',()=>{if(setupOpen){$('go').click();return}setupOpen=true;render();window.scrollTo(0,0)});

render();
}
</script>
</body>
</html>
